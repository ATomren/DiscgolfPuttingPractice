<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Putt Log</title>
<style>
:root{--bg:#e8eee9;--card:#fff;--ink:#17302b;--mute:#6b7f78;--line:#d3ddd8;--hit:#2f8f5b;--acc:#e8590c;--track:#dfe7e3;color-scheme:light}
@media(prefers-color-scheme:dark){:root{--bg:#0f1c19;--card:#182a26;--ink:#e6f0ec;--mute:#8fa59d;--line:#2a403a;--hit:#4cc58a;--acc:#ff8a3d;--track:#233732;color-scheme:dark}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 "Avenir Next","Trebuchet MS",system-ui,sans-serif}
#app{max-width:520px;margin:0 auto;padding:max(14px,env(safe-area-inset-top)) 14px 110px}
.card{background:var(--card);border-radius:18px;padding:16px;margin-bottom:12px;border:1px solid var(--line)}
h2{font-size:15px;margin:0 0 10px;font-weight:700}
p{margin:4px 0}.mute{color:var(--mute);font-size:14px}
button{font:inherit;color:inherit;border:0;cursor:pointer}
.hero{display:flex;gap:18px;align-items:center}
.trk{fill:none;stroke:var(--track);stroke-width:12}
.arc{fill:none;stroke:var(--hit);stroke-width:12;stroke-linecap:round;transition:stroke-dashoffset .5s}
.big{font-size:28px;font-weight:800;fill:var(--ink)}
.step{display:flex;align-items:center;justify-content:space-between;gap:10px}
.step button{width:56px;height:56px;border-radius:50%;background:var(--track);font-size:28px;font-weight:700}
.dist{text-align:center;font-size:44px;font-weight:800;line-height:1}
.dist small{display:block;font-size:14px;font-weight:600;color:var(--acc);margin-top:4px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips button{flex:1;min-width:40px;padding:10px 0;border-radius:12px;background:var(--track);font-weight:700}
.chips button.on{background:var(--ink);color:var(--card)}
.hits{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:8px}
.hits button{height:76px;border-radius:16px;background:var(--hit);color:#fff;font-size:30px;font-weight:800}
.hits button:first-child{background:var(--track);color:var(--ink)}
.hits button:active{transform:scale(.95)}
.row{display:flex;align-items:center;gap:10px;padding:6px 0}
.row .l{width:64px;font-weight:700;flex:none}
.bar{flex:1;height:14px;border-radius:7px;background:var(--track);overflow:hidden}
.bar i{display:block;height:100%;background:var(--hit);border-radius:7px}
.row .r{width:84px;text-align:right;font-size:14px;flex:none}
.row.low{opacity:.5}
.list .row{border-top:1px solid var(--line)}
.x{background:none;color:var(--mute);font-size:20px;padding:0 6px}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;padding:16px 0;background:none;font-weight:700;color:var(--mute)}
nav button.on{color:var(--acc)}
.btn{display:block;width:100%;padding:14px;border-radius:14px;background:var(--ink);color:var(--card);font-weight:700;text-align:center;margin-top:8px}
.btn.alt{background:var(--track);color:var(--ink)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.stats b{display:block;font-size:26px}
#toast{position:fixed;left:14px;right:14px;bottom:calc(76px + env(safe-area-inset-bottom));max-width:492px;margin:0 auto;background:var(--ink);color:var(--card);padding:12px 16px;border-radius:14px;display:none;justify-content:space-between;align-items:center}
#toast button{background:none;color:var(--acc);font-weight:800}
input[type=file]{width:100%;margin-top:8px}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast"></div>
<nav><button data-a="tab" data-v="log">Log</button><button data-a="tab" data-v="stats">Stats</button><button data-a="tab" data-v="data">Data</button></nav>
<script>
const K='puttlog.v1';
let S={rounds:[],discs:3,dist:6,lastExport:0},tab='log',tt;
try{const r=localStorage.getItem(K);if(r)S=Object.assign(S,JSON.parse(r))}catch(e){}
const save=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(e){toast('Could not save. Export now.')}};
const $=s=>document.querySelector(s);
const day=t=>new Date(t).toLocaleDateString('en-CA');
const zone=d=>d<=10?'C1':d<=20?'C2':'Outside C2';
const sum=a=>({n:a.reduce((x,r)=>x+r.n,0),h:a.reduce((x,r)=>x+r.h,0)});
const pct=o=>o.n?Math.round(100*o.h/o.n):0;
const today=()=>S.rounds.filter(r=>day(r.t)===day(Date.now()));

function streak(){const ds=new Set(S.rounds.map(r=>day(r.t)));let c=0,d=new Date();if(!ds.has(day(d)))d.setDate(d.getDate()-1);while(ds.has(day(d))){c++;d.setDate(d.getDate()-1)}return c}

function toast(msg,undo){const t=$('#toast');t.innerHTML=`<span>${msg}</span>${undo?'<button data-a="undo">Undo</button>':''}`;t.style.display='flex';clearTimeout(tt);tt=setTimeout(()=>t.style.display='none',4000)}

function logView(){
  const td=today(),s=sum(td),C=2*Math.PI*52,off=C*(1-(s.n?s.h/s.n:0));
  let hits='';for(let i=0;i<=S.discs;i++)hits+=`<button data-a="hit" data-v="${i}">${i}</button>`;
  let chips='';for(let i=1;i<=6;i++)chips+=`<button class="${i===S.discs?'on':''}" data-a="discs" data-v="${i}">${i}</button>`;
  const list=td.slice().reverse().slice(0,6).map(r=>`<div class="row"><span class="l">${r.d} m</span><span style="flex:1">${r.h} of ${r.n}</span><button class="x" data-a="del" data-v="${r.t}">×</button></div>`).join('');
  return `<div class="card hero"><svg viewBox="0 0 120 120" width="120" height="120"><circle cx="60" cy="60" r="52" class="trk"/><circle cx="60" cy="60" r="52" class="arc" stroke-dasharray="${C}" stroke-dashoffset="${off}" transform="rotate(-90 60 60)"/><text x="60" y="69" text-anchor="middle" class="big">${s.n?pct(s)+'%':'-'}</text></svg>
  <div><b>Today</b><p>${s.h} of ${s.n} putts</p><p class="mute">${td.length} rounds, ${streak()} day streak</p></div></div>
  <div class="card"><h2>Distance</h2><div class="step"><button data-a="dist" data-v="-1">−</button><div class="dist">${S.dist} m<small>${zone(S.dist)}</small></div><button data-a="dist" data-v="1">+</button></div></div>
  <div class="card"><h2>Discs thrown</h2><div class="chips">${chips}</div></div>
  <div class="card"><h2>How many went in?</h2><div class="hits">${hits}</div></div>
  ${list?`<div class="card list"><h2>Today's rounds</h2>${list}</div>`:''}`;
}

function bars(rows){return rows.map(([l,o,min])=>`<div class="row ${o.n<min?'low':''}"><span class="l">${l}</span><div class="bar"><i style="width:${pct(o)}%"></i></div><span class="r">${o.n?pct(o)+'%':'-'} <span class="mute">${o.h}/${o.n}</span></span></div>`).join('')}

function statsView(){
  const R=S.rounds;if(!R.length)return `<div class="card"><h2>No data yet</h2><p class="mute">Log your first round on the Log tab.</p></div>`;
  const t=sum(R),days=[...new Set(R.map(r=>day(r.t)))].sort();
  const z=['C1','C2','Outside C2'].map(n=>[n,sum(R.filter(r=>zone(r.d)===n)),1]);
  const ds=[...new Set(R.map(r=>r.d))].sort((a,b)=>a-b).map(d=>[d+' m',sum(R.filter(r=>r.d===d)),10]);
  const last=days.slice(-14).map(d=>pct(sum(R.filter(r=>day(r.t)===d))));
  const w=300/Math.max(last.length,1);
  const svg=last.map((p,i)=>`<rect x="${i*w+2}" y="${100-p}" width="${w-4}" height="${p}" rx="3" fill="var(--hit)"/>`).join('');
  return `<div class="card stats"><div><b>${t.n}</b><span class="mute">putts</span></div><div><b>${pct(t)}%</b><span class="mute">hit rate</span></div><div><b>${days.length}</b><span class="mute">days</span></div></div>
  <div class="card"><h2>By zone</h2>${bars(z)}</div>
  <div class="card"><h2>Last ${last.length} practice days</h2><svg viewBox="0 0 300 100" width="100%" preserveAspectRatio="none" style="height:110px"><line x1="0" x2="300" y1="50" y2="50" stroke="var(--line)"/>${svg}</svg><p class="mute">Bar height is hit % per day.</p></div>
  <div class="card"><h2>By distance</h2>${bars(ds)}<p class="mute">Faded rows have fewer than 10 putts, so treat them as rough.</p></div>`;
}

function dataView(){
  const n=S.rounds.filter(r=>r.t>S.lastExport),p=sum(n).n;
  const when=S.lastExport?Math.floor((Date.now()-S.lastExport)/864e5)+' days ago ('+day(S.lastExport)+')':'Never';
  return `<div class="card"><h2>Backup</h2><p>Last exported: <b>${when}</b></p><p>Since then: <b>${p} putts</b> in ${n.length} rounds</p>
  <button class="btn" data-a="export">Export backup</button></div>
  <div class="card"><h2>Restore</h2><p class="mute">Replaces everything in this browser with the file's data.</p><input type="file" accept=".json,application/json" id="imp"></div>`;
}

function render(){
  $('#app').innerHTML={log:logView,stats:statsView,data:dataView}[tab]();
  document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.v===tab));
}

function exportData(){
  const b=new Blob([JSON.stringify({app:'puttlog',v:1,exported:Date.now(),rounds:S.rounds},null,1)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='puttlog-'+day(Date.now())+'.json';a.click();
  S.lastExport=Date.now();save();render();
}

function importData(f){
  const r=new FileReader();
  r.onload=()=>{try{const j=JSON.parse(r.result);if(!Array.isArray(j.rounds))throw 0;
    const ok=j.rounds.filter(x=>x&&x.t&&x.d>0&&x.n>0&&x.h>=0&&x.h<=x.n);
    if(!confirm('Replace '+S.rounds.length+' rounds with '+ok.length+' from the file?'))return;
    S.rounds=ok;S.lastExport=Date.now();save();render();toast('Imported '+ok.length+' rounds')}catch(e){toast('Not a valid backup file')}};
  r.readAsText(f);
}

document.addEventListener('click',e=>{
  const b=e.target.closest('[data-a]');if(!b)return;const a=b.dataset.a,v=b.dataset.v;
  if(a==='tab')tab=v;
  else if(a==='dist')S.dist=Math.min(40,Math.max(1,S.dist+ +v));
  else if(a==='discs')S.discs=+v;
  else if(a==='hit'){S.rounds.push({t:Date.now(),d:S.dist,n:S.discs,h:+v});toast(v+' of '+S.discs+' from '+S.dist+' m',1)}
  else if(a==='undo'){S.rounds.pop();$('#toast').style.display='none'}
  else if(a==='del')S.rounds=S.rounds.filter(r=>r.t!==+v);
  else if(a==='export')return exportData();
  save();render();
});
document.addEventListener('change',e=>{if(e.target.id==='imp'&&e.target.files[0])importData(e.target.files[0])});
render();
</script>
</body>
</html>
