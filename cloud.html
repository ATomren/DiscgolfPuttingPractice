<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Putt Log</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#17302b">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Putt Log">
<style>
:root{--bg:#e8eee9;--card:#fff;--ink:#17302b;--mute:#6b7f78;--line:#d3ddd8;--hit:#2f8f5b;--acc:#e8590c;--track:#dfe7e3;color-scheme:light}
@media(prefers-color-scheme:dark){:root{--bg:#0f1c19;--card:#182a26;--ink:#e6f0ec;--mute:#8fa59d;--line:#2a403a;--hit:#4cc58a;--acc:#ff8a3d;--track:#233732;color-scheme:dark}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 "Avenir Next","Trebuchet MS",system-ui,sans-serif}
#app{max-width:520px;margin:0 auto;padding:max(14px,env(safe-area-inset-top)) 14px 110px}
.card{background:var(--card);border-radius:18px;padding:16px;margin-bottom:12px;border:1px solid var(--line)}
h2{font-size:15px;margin:0 0 10px;font-weight:700}
p{margin:4px 0}.mute{color:var(--mute);font-size:14px}
button{font:inherit;color:inherit;border:0;cursor:pointer;-webkit-user-select:none;user-select:none}
.hero{display:flex;gap:18px;align-items:center}
.trk{fill:none;stroke:var(--track);stroke-width:12}
.arc{fill:none;stroke:var(--hit);stroke-width:12;stroke-linecap:round;transition:stroke-dashoffset .5s}
.big{font-size:28px;font-weight:800;fill:var(--ink)}
.step{display:flex;align-items:center;justify-content:space-between;gap:10px}
.step button{width:56px;height:56px;border-radius:50%;background:var(--track);font-size:28px;font-weight:700}
.dist{text-align:center;font-size:44px;font-weight:800;line-height:1}
.dist small{display:block;font-size:14px;font-weight:600;color:var(--acc);margin-top:4px}
.disc{margin-left:auto;flex:none;width:76px;height:76px;border-radius:18px;background:var(--track);font-weight:800;font-size:30px;line-height:1}
.disc small{display:block;font-size:12px;font-weight:600;color:var(--mute);margin-top:2px}
#pad{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:center;justify-content:center;z-index:5}
#pad div{background:var(--card);border-radius:20px;padding:16px;width:min(300px,90vw)}
#pad p{text-align:center;font-weight:700;margin:0 0 10px}
#pad section{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
#pad button{height:64px;border-radius:14px;background:var(--track);font-size:26px;font-weight:800}
#pad button.on{background:var(--ink);color:var(--card)}
.hits{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:8px}
.hits button{height:76px;border-radius:16px;background:var(--hit);color:#fff;font-size:30px;font-weight:800}
.hits button:first-child{background:var(--track);color:var(--ink)}
.hits button:active{transform:scale(.95)}
.row{display:flex;align-items:center;gap:10px;padding:6px 0}
.row .l{width:84px;white-space:nowrap;font-weight:700;flex:none}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips button{flex:1;min-width:64px;padding:10px 6px;border-radius:12px;background:var(--track);font-weight:700}
.chips button.on{background:var(--ink);color:var(--card)}
select{font:inherit;width:100%;margin-top:10px;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink)}
.rings{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.rings b{display:block}
a.btn{text-decoration:none}
.stand+.stand{border-top:1px solid var(--line);margin-top:6px;padding-top:6px}
.win,.inp{width:100%;font:inherit;padding:8px;margin-top:4px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink)}
#gm{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:center;justify-content:center;z-index:5}
#gm>div{background:var(--card);border-radius:20px;padding:16px;width:min(340px,92vw);max-height:92vh;overflow-y:auto}
.dot{width:10px;height:10px;border-radius:50%;flex:none}
.bar{flex:1;height:14px;border-radius:7px;background:var(--track);overflow:hidden}
.bar i{display:block;height:100%;background:var(--hit);border-radius:7px}
.row .r{width:84px;text-align:right;font-size:14px;flex:none}
.list .row{border-top:1px solid var(--line)}
.x{background:none;color:var(--mute);font-size:20px;padding:0 6px}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;padding:16px 0;background:none;font-weight:700;color:var(--mute)}
nav button.on{color:var(--acc)}
.btn{display:block;width:100%;padding:14px;border-radius:14px;background:var(--ink);color:var(--card);font-weight:700;text-align:center;margin-top:8px}
.btn.alt{background:var(--track);color:var(--ink)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.stats b{display:block;font-size:26px}
#toast{position:fixed;left:14px;right:14px;bottom:calc(76px + env(safe-area-inset-bottom));max-width:492px;margin:0 auto;background:var(--ink);color:var(--card);padding:12px 16px;border-radius:14px;display:none;justify-content:space-between;align-items:center}
#toast button{background:none;color:var(--acc);font-weight:800}
input[type=file]{width:100%;margin-top:8px}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast"></div>
<div id="pad" data-a="padx"><div><p>Discs thrown</p><section></section></div></div>
<div id="gm" data-a="gx"><div></div></div>
<nav><button data-a="tab" data-v="log">Log</button><button data-a="tab" data-v="today">Today</button><button data-a="tab" data-v="trends">Trends</button><button data-a="tab" data-v="settings">Settings</button></nav>
<script>
const VIPPS_NUMBER='4166NL'; // copied to clipboard on tap, never shown on screen
const VIPPS_URL='';     // paste your Vipps link here (leave empty to hide)
const FEEDBACK_URL='https://docs.google.com/forms/d/e/1FAIpQLScGDWXz6PX2gsrNYgSjqVr2vagVfksTCPE0ZS_LOUvTBoHH2w/viewform';  // paste a feedback form link here (leave empty to hide)
const FIREBASE_CONFIG={ // public project identifiers, not secrets: the Firestore rules protect the data. null = local only
  apiKey:"AIzaSyCxqPawrzt9YDiMdJiyYScWY78rWd13Ii0",
  authDomain:"discgolfputtingpractice.firebaseapp.com",
  projectId:"discgolfputtingpractice",
  storageBucket:"discgolfputtingpractice.firebasestorage.app",
  messagingSenderId:"788451489545",
  appId:"1:788451489545:web:2b43822c3f1666c80a45d8"
};
const K='puttlog.v1';
let S={rounds:[],discs:3,dist:6,lastExport:0,win:{},goal:null,pend:[],pdel:[],cloudUid:'',lastPull:0,sSig:''},tab='log',tt,padOpen=false,trend='zones',tm=null,gOpen=false,gd=null,fb=null,user=null,syncing=false,cloudMsg='',st,lastSyncAt=0;
try{const r=localStorage.getItem(K);if(r)S=Object.assign(S,JSON.parse(r))}catch(e){}
S.dist=Math.max(4,S.dist);
S.win=Object.assign({'C1X':[30,30],'C2':[20,20],'Outside C2':[10,10]},S.win);
const persist=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(e){toast('Could not save. Export now.')}};
const save=()=>{persist();if(user){clearTimeout(st);st=setTimeout(()=>sync(false),800)}};
if(S.rounds.some(r=>r.d<4)){S.rounds=S.rounds.filter(r=>r.d>=4);save()}
const $=s=>document.querySelector(s);
const day=t=>new Date(t).toLocaleDateString('en-CA');
const zone=d=>d<=10?'C1X':d<=20?'C2':'Outside C2';
const sum=a=>({n:a.reduce((x,r)=>x+r.n,0),h:a.reduce((x,r)=>x+r.h,0)});
const pct=o=>o.n?Math.round(100*o.h/o.n):0;
const col=p=>`hsl(${Math.round(p*1.2)} 65% 42%)`;
const ZC={'C1X':'#2f8f5b','C2':'#e8590c','Outside C2':'#5b6ee8'};
const md=d=>(+d.slice(5,7))+'/'+(+d.slice(8));
const today=()=>S.rounds.filter(r=>day(r.t)===day(Date.now()));

function streak(){const ds=new Set(S.rounds.map(r=>day(r.t)));let c=0,d=new Date();if(!ds.has(day(d)))d.setDate(d.getDate()-1);while(ds.has(day(d))){c++;d.setDate(d.getDate()-1)}return c}

function toast(msg,undo){const t=$('#toast');t.innerHTML=`<span>${msg}</span>${undo?'<button data-a="undo">Undo</button>':''}`;t.style.display='flex';clearTimeout(tt);tt=setTimeout(()=>t.style.display='none',4000)}

function logView(){
  const td=today(),s=sum(td),C=2*Math.PI*52,off=C*(1-(s.n?s.h/s.n:0));
  let hits='';for(let i=0;i<=S.discs;i++)hits+=`<button data-a="hit" data-v="${i}">${i}</button>`;
  const list=td.slice().reverse().map(r=>`<div class="row"><span class="l">${r.d} m</span><span style="flex:1">${r.h} of ${r.n}</span><button class="x" data-a="del" data-v="${r.t}">×</button></div>`).join('');
  return `<div class="card hero"><svg viewBox="0 0 120 120" width="104" height="104"><circle cx="60" cy="60" r="52" class="trk"/><circle cx="60" cy="60" r="52" class="arc" style="stroke:${col(pct(s))}" stroke-dasharray="${C}" stroke-dashoffset="${off}" transform="rotate(-90 60 60)"/><text x="60" y="69" text-anchor="middle" class="big">${s.n?pct(s)+'%':'-'}</text></svg>
  <div><b>Today</b><p>${s.h} of ${s.n} putts</p><p class="mute">${td.length} rounds, ${streak()} day streak</p></div><button class="disc" data-a="pad">${S.discs}<small>discs</small></button></div>
  <div class="card"><h2>Distance</h2><div class="step"><button data-a="dist" data-v="-1">−</button><div class="dist">${S.dist} m<small>${zone(S.dist)}</small></div><button data-a="dist" data-v="1">+</button></div></div>
  <div class="card"><h2>How many went in?</h2><div class="hits"${S.discs>5?` style="grid-auto-flow:row;grid-template-columns:repeat(${Math.ceil((S.discs+1)/2)},1fr)"`:''}>${hits}</div></div>
  ${list?`<div class="card list"><h2>Today's rounds</h2><div style="max-height:236px;overflow-y:auto">${list}</div></div>`:''}`;
}

function bars(rows){return rows.map(([l,o,min])=>`<div class="row"><span class="l">${l}</span><div class="bar"><i style="width:${pct(o)}%;background:${col(pct(o))}"></i></div><span class="r">${o.n?pct(o)+'%':'-'} <span class="mute">${o.h}/${o.n}</span></span></div>`).join('')}

const take=(rs,k)=>{const o=[];let c=0;for(const r of rs){if(c>=k)break;o.push(r);c+=r.n}return o};

function zoneRings(rs){const C=2*Math.PI*52;return ['C1X','C2','Outside C2'].map(n=>{const o=sum(rs.filter(r=>zone(r.d)===n));return `<div><svg viewBox="0 0 120 120" width="100%" style="max-width:104px"><circle cx="60" cy="60" r="52" class="trk"/><circle cx="60" cy="60" r="52" class="arc" style="stroke:${col(pct(o))}" stroke-dasharray="${C}" stroke-dashoffset="${C*(1-(o.n?o.h/o.n:0))}" transform="rotate(-90 60 60)"/><text x="60" y="69" text-anchor="middle" class="big">${o.n?pct(o)+'%':'-'}</text></svg><b>${n}</b><span class="mute">${o.h} of ${o.n}</span></div>`}).join('')}

function todayView(){
  const R=today();
  if(!R.length)return `<div class="card"><h2>Today</h2><p class="mute">Nothing logged yet. Go putt!</p></div>`;
  const t=sum(R);
  const ds=[...new Set(R.map(r=>r.d))].sort((a,b)=>a-b).map(d=>[d+' m',sum(R.filter(r=>r.d===d))]);
  return `<div class="card stats"><div><b>${t.n}</b><span class="mute">putts</span></div><div><b style="color:${col(pct(t))}">${pct(t)}%</b><span class="mute">hit rate</span></div><div><b>${R.length}</b><span class="mute">rounds</span></div></div>
  <div class="card rings">${zoneRings(R)}</div>
  <div class="card"><h2>By distance</h2>${bars(ds)}</div>`;
}

function series(rs){const m={};rs.forEach(r=>{(m[day(r.t)]=m[day(r.t)]||[]).push(r)});return Object.keys(m).sort().map(d=>({d,...sum(m[d])}))}

function goalInfo(){
  const g=S.goal;if(!g)return null;
  const rs=S.rounds.filter(r=>g.kind==='m'?r.d===g.m:zone(r.d)===g.z).sort((a,b)=>a.t-b.t);
  const X=S.win[g.kind==='m'?zone(g.m):g.z][0],o=sum(take(rs.slice().reverse(),X));
  return {name:g.kind==='m'?g.m+' m':g.z,target:g.pct,cur:o.n?pct(o):null,n:o.n};
}

function goalCard(){
  const gi=goalInfo();let body='<p class="mute">Pick a target hit rate and watch the bar fill.</p>';
  if(gi){
    const prog=gi.cur===null?0:Math.min(100,Math.round(100*gi.cur/gi.target));
    const msg=gi.cur===null?'No putts logged here yet.':gi.cur>=gi.target?'Goal reached! 🎯 Time to raise the bar?':(gi.target-gi.cur)+' points to go, based on your last '+gi.n+' putts.';
    body=`<div style="display:flex;justify-content:space-between;align-items:baseline"><b>${gi.name} at ${gi.target}%</b><span class="mute">${gi.cur===null?'-':'now '+gi.cur+'%'}</span></div><div class="bar" style="height:18px;margin:8px 0"><i style="width:${prog}%;background:${col(prog)}"></i></div><p class="mute">${msg}</p>`;
  }
  return `<div class="card"><h2>Goal</h2>${body}<button class="btn alt" data-a="goal">${gi?'Change goal':'Set goal'}</button></div>`;
}

function goalModal(){
  const d=gd,ch=(k,l,a,on)=>`<button class="${on?'on':''}" data-a="${a}" data-v="${k}">${l}</button>`;
  const pick=d.kind==='z'
    ?`<div class="chips" style="margin-top:10px">${['C1X','C2','Outside C2'].map(z=>ch(z,z==='Outside C2'?'Outside':z,'gz',d.z===z)).join('')}</div>`
    :`<div class="step" style="margin-top:10px"><button data-a="gmd" data-v="-1">−</button><div class="dist" style="font-size:32px">${d.m} m</div><button data-a="gmd" data-v="1">+</button></div>`;
  return `<h2>${S.goal?'Change goal':'Set goal'}</h2><div class="chips">${ch('z','Zone','gk',d.kind==='z')}${ch('m','Meter','gk',d.kind==='m')}</div>${pick}
  <p class="mute" style="margin:14px 0 4px;text-align:center">Target hit rate</p>
  <div class="step"><button data-a="gp" data-v="-5">−</button><div class="dist" style="font-size:32px">${d.pct}%</div><button data-a="gp" data-v="5">+</button></div>
  <button class="btn" data-a="gsave">Save goal</button><button class="btn alt" data-a="gcancel">Cancel</button>${S.goal?'<button class="btn alt" data-a="gclear">Remove goal</button>':''}`;
}

function trendsView(){
  const R=S.rounds;
  if(!R.length)return `<div class="card"><h2>Trends</h2><p class="mute">Log some rounds to see your progress.</p></div>`;
  const dists=[...new Set(R.map(r=>r.d))].sort((a,b)=>a-b);
  const T=sum(R);
  if(!dists.includes(tm))tm=dists.slice().sort((a,b)=>sum(R.filter(r=>r.d===b)).n-sum(R.filter(r=>r.d===a)).n)[0];
  const defs=trend==='zones'?['C1X','C2','Outside C2'].map(n=>({name:n,color:ZC[n],rs:R.filter(r=>zone(r.d)===n)}))
    :trend==='m'?[{name:tm+' m',color:'var(--ink)',rs:R.filter(r=>r.d===tm)}]
    :[{name:trend,color:'var(--ink)',rs:R.filter(r=>zone(r.d)===trend)}];
  defs.forEach(x=>x.pts=series(x.rs));
  const opts=[['zones','All zones'],['C1X','C1X'],['C2','C2'],['Outside C2','Outside'],['m','Meter']];
  const chips=`<div class="chips">${opts.map(([k,l])=>`<button class="${trend===k?'on':''}" data-a="trend" data-v="${k}">${l}</button>`).join('')}</div>`;
  const sel=trend==='m'?`<select id="mtr">${dists.map(d=>`<option value="${d}" ${d===tm?'selected':''}>${d} m</option>`).join('')}</select>`:'';
  const ax=[...new Set(defs.flatMap(x=>x.pts.map(p=>p.d)))].sort().slice(-30);
  let chart='<p class="mute">No putts from this range yet.</p>';
  if(ax.length){
    const W=320,H=150,L=30,B=18,pw=W-L-8;
    const X=i=>L+(ax.length>1?i*pw/(ax.length-1):pw/2),Y=p=>8+(H-B-8)*(1-p/100);
    let g=[0,50,100].map(v=>`<line x1="${L}" x2="${W}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)"/><text x="0" y="${Y(v)+4}" font-size="10" fill="var(--mute)">${v}%</text>`).join('');
    defs.forEach(x=>{
      const pts=ax.map((d,i)=>{const p=x.pts.find(q=>q.d===d);return p&&{x:X(i),y:Y(pct(p)),p:pct(p),n:p.n}}).filter(Boolean);
      if(pts.length>1)g+=`<polyline points="${pts.map(q=>q.x+','+q.y).join(' ')}" fill="none" stroke="${x.color}" stroke-width="2" stroke-linejoin="round" opacity=".75"/>`;
      g+=pts.map(q=>`<circle cx="${q.x}" cy="${q.y}" r="${3+Math.min(3,q.n/6)}" fill="${defs.length>1?x.color:col(q.p)}" stroke="var(--card)" stroke-width="1.5"/>`).join('');
    });
    g+=`<text x="${L}" y="${H-3}" font-size="10" fill="var(--mute)">${md(ax[0])}</text><text x="${W}" y="${H-3}" font-size="10" text-anchor="end" fill="var(--mute)">${md(ax[ax.length-1])}</text>`;
    chart=`<svg viewBox="0 0 ${W} ${H}" width="100%">${g}</svg><p class="mute">Each dot is one practice day. Bigger dot = more putts.</p>`;
  }
  const arrow=(dl,txt)=>`<span style="color:${dl>0?'var(--hit)':dl<0?'#d9534f':'var(--mute)'};font-weight:700">${dl>0?'▲':dl<0?'▼':'='} ${Math.abs(dl)}</span> <span class="mute">${txt}</span>`;
  const rows=defs.map(x=>{
    const dot=defs.length>1?`<span class="dot" style="background:${x.color}"></span>`:'';
    const all=sum(x.rs);
    if(!all.n)return `<div class="stand"><div class="row">${dot}<span class="l" style="width:96px">${x.name}</span><span class="mute">no putts yet</span></div></div>`;
    const rs=x.rs.slice().sort((a,b)=>a.t-b.t),last=x.pts[x.pts.length-1],cur=pct(last);
    const [X,Y]=S.win[trend==='m'?zone(tm):x.name]||[20,20];
    const before=rs.filter(r=>day(r.t)<last.d);
    const prev=take(before.slice().reverse(),X),first=take(before,Y);
    const dup=prev.length===before.length&&first.length===before.length;
    const d1=before.length?cur-pct(sum(prev)):null,d2=before.length&&!dup?cur-pct(sum(first)):null;
    const ar=d1===null?'':`<div style="text-align:center;font-size:14px">${arrow(d1,'vs previous '+sum(prev).n+' putts')}${d2===null?'':' &nbsp; '+arrow(d2,'vs first '+sum(first).n+' putts')}</div>`;
    const lbl=(last.d===day(Date.now())?'today':md(last.d))+' · '+last.n+' putts';
    return `<div class="stand"><div class="row">${dot}<span class="l" style="width:96px">${x.name}</span><span style="flex:1;text-align:center"><span style="font-size:26px;font-weight:800;color:${col(cur)}">${cur}%</span><br><span class="mute" style="font-size:12px">${lbl}</span></span><span class="mute" style="text-align:right;font-size:13px">all-time ${pct(all)}%<br>${all.n} putts</span></div>${ar}</div>`;
  }).join('');
  return `<div class="card stats"><div><b>${T.n}</b><span class="mute">putts</span></div><div><b style="color:${col(pct(T))}">${pct(T)}%</b><span class="mute">hit rate</span></div><div><b>${R.length}</b><span class="mute">rounds</span></div></div>
  ${goalCard()}
  <div class="card">${chips}${sel}</div>
  <div class="card"><h2>Hit rate per practice day</h2>${chart}</div>
  <div class="card"><h2>Where you stand</h2>${rows}<p class="mute">Big number: today (or your latest practice day). Arrows compare it with earlier putts. Window sizes are in Settings.</p></div>`;
}

function dataView(){
  const n=S.rounds.filter(r=>r.t>S.lastExport),p=sum(n).n;
  const when=S.lastExport?Math.floor((Date.now()-S.lastExport)/864e5)+' days ago ('+day(S.lastExport)+')':'Never';
  const sup=(VIPPS_URL||VIPPS_NUMBER||FEEDBACK_URL)?`<div class="card"><h2>Support</h2><p class="mute">Enjoying it? Tips and bug reports are welcome.</p>${FEEDBACK_URL?`<a class="btn alt" href="${FEEDBACK_URL}" target="_blank" rel="noopener">Send feedback</a>`:''}${VIPPS_URL?`<a class="btn" href="${VIPPS_URL}" target="_blank" rel="noopener">Support with Vipps</a>`:VIPPS_NUMBER?`<button class="btn" data-a="vipps">Support with Vipps</button><p class="mute">Copies my Vipps code. Open Vipps and paste it.</p>`:''}</div>`:'';
  const wr=['C1X','C2','Outside C2'].map(z=>`<div class="row"><span class="l" style="width:96px">${z}</span><label class="mute" style="flex:1;font-size:13px">Previous<input class="win" type="number" inputmode="numeric" min="5" max="500" data-z="${z}" data-i="0" value="${S.win[z][0]}"></label><label class="mute" style="flex:1;font-size:13px">First<input class="win" type="number" inputmode="numeric" min="5" max="500" data-z="${z}" data-i="1" value="${S.win[z][1]}"></label></div>`).join('');
  return `${accountCard()}<div class="card"><h2>Backup</h2><p>Last exported: <b>${when}</b></p><p>Since then: <b>${p} putts</b> in ${n.length} rounds</p>
  <button class="btn" data-a="export">Export backup</button></div>
  <div class="card"><h2>Restore</h2><p class="mute">Adds rounds from a backup file. Rounds already here are kept and never duplicated.</p><input type="file" accept=".json,application/json" id="imp"></div>${sup}<div class="card"><h2>Trend comparison</h2><p class="mute">Trends compares today with the previous and the first number of putts below, per zone.</p>${wr}</div><div class="card"><h2>Reset</h2><p class="mute">Deletes all rounds in this browser, and from your cloud account if signed in. Export first if unsure.</p><button class="btn" style="background:#d9534f;color:#fff" data-a="wipe">Delete all data</button></div>`;
}

function render(){
  $('#app').innerHTML={log:logView,today:todayView,trends:trendsView,settings:dataView}[tab]();
  document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.v===tab));
  $('#gm').style.display=gOpen?'flex':'none';
  if(gOpen)$('#gm>div').innerHTML=goalModal();
  $('#pad').style.display=padOpen?'flex':'none';
  $('#pad section').innerHTML=[1,2,3,4,5,6,7,8,9].map(i=>`<button class="${i===S.discs?'on':''}" data-a="discs" data-v="${i}">${i}</button>`).join('');
}

const esc=t=>String(t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const rk=r=>r.t+'_'+r.d;
function qAdd(r){if(FIREBASE_CONFIG)S.pend.push(r)}
function qDel(r){
  if(!FIREBASE_CONFIG)return;
  const k=rk(r),had=S.pend.some(x=>rk(x)===k);
  S.pend=S.pend.filter(x=>rk(x)!==k);
  if(!had)S.pdel.push(k);
}

function applyCloud(x){
  const c=cleanSettings(x);
  if(c){if(c.discs)S.discs=c.discs;if(c.dist)S.dist=c.dist;if(c.win)Object.assign(S.win,c.win);if(c.goal)S.goal=c.goal}
  if(x&&x.goal===null)S.goal=null;
}

async function initCloud(){
  if(!FIREBASE_CONFIG)return;
  try{
    const V='https://www.gstatic.com/firebasejs/10.12.2/';
    const [A,Au,F]=await Promise.all([import(V+'firebase-app.js'),import(V+'firebase-auth.js'),import(V+'firebase-firestore.js')]);
    const app=A.initializeApp(FIREBASE_CONFIG);
    fb={Au,F,auth:Au.getAuth(app),db:F.getFirestore(app)};
    Au.onAuthStateChanged(fb.auth,u=>{user=u;cloudMsg='';render();if(u)sync(true)});
  }catch(e){cloudMsg='Cloud unavailable right now. The app still works and will sync later.';render()}
}

async function sync(pull){
  if(!fb||!user||syncing||!navigator.onLine)return;
  syncing=true;
  try{
    const F=fb.F,db=fb.db,base=['users',user.uid],first=S.cloudUid!==user.uid;
    if(first){S.pend=S.rounds.slice();S.pdel=[];S.lastPull=0;S.sSig=''}
    const sent=S.pend.slice(),sentD=S.pdel.slice(),now=Date.now();
    const ops=sent.map(r=>[rk(r),Object.assign({},r,{ts:now})]).concat(sentD.map(k=>[k,{del:true,ts:now}]));
    for(let i=0;i<ops.length;i+=400){const b=F.writeBatch(db);ops.slice(i,i+400).forEach(([k,v])=>b.set(F.doc(db,...base,'rounds',k),v));await b.commit()}
    S.pend=S.pend.filter(r=>!sent.includes(r));S.pdel=S.pdel.filter(k=>!sentD.includes(k));S.cloudUid=user.uid;
    const sref=F.doc(db,...base,'meta','settings'),sig=()=>JSON.stringify([S.discs,S.dist,S.win,S.goal]);
    const obj=()=>({discs:S.discs,dist:S.dist,win:S.win,goal:S.goal,ts:Date.now()});
    if(!S.sSig){const g=await F.getDoc(sref);if(g.exists())applyCloud(g.data());else await F.setDoc(sref,obj());S.sSig=sig()}
    else if(sig()!==S.sSig){await F.setDoc(sref,obj());S.sSig=sig()}
    else if(pull){const g=await F.getDoc(sref);if(g.exists())applyCloud(g.data());S.sSig=sig()}
    if(pull||first){
      const q=F.query(F.collection(db,...base,'rounds'),F.where('ts','>',Math.max(0,S.lastPull-6e5)));
      const snap=await F.getDocs(q),byK=new Map(S.rounds.map(r=>[rk(r),r]));let mx=S.lastPull;
      snap.forEach(d=>{const v=d.data();mx=Math.max(mx,v.ts||0);
        if(v.del)byK.delete(d.id);
        else if(v.t&&v.d>=4&&v.n>0&&v.h>=0&&v.h<=v.n)byK.set(d.id,{t:v.t,d:v.d,n:v.n,h:v.h})});
      S.rounds=[...byK.values()].sort((a,b)=>a.t-b.t);S.lastPull=mx;lastSyncAt=Date.now();
    }
    cloudMsg='Synced '+new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});
  }catch(e){cloudMsg='Sync failed, will retry when online'}
  syncing=false;persist();render();
}

function cloudAuth(kind){
  if(!fb)return;
  const A=fb.Au,au=fb.auth,em=(($('#em')||{}).value||'').trim(),pw=($('#pw')||{}).value||'';
  let p;
  if(kind==='google')p=A.signInWithPopup(au,new A.GoogleAuthProvider());
  else if(kind==='in')p=A.signInWithEmailAndPassword(au,em,pw);
  else if(kind==='new')p=A.createUserWithEmailAndPassword(au,em,pw);
  else if(kind==='reset'){if(!em){toast('Enter your email first');return}p=A.sendPasswordResetEmail(au,em).then(()=>toast('Password reset email sent'))}
  else if(kind==='out')p=A.signOut(au);
  if(p)p.catch(e=>toast('Failed: '+String(e.code||e.message).replace('auth/','').replace(/-/g,' ')));
}

async function cloudDelete(){
  if(!fb||!user)return;
  if(!confirm('Delete ALL your cloud data and your account? Putts on this phone stay. This cannot be undone.'))return;
  const F=fb.F,db=fb.db,base=['users',user.uid];
  try{
    const snap=await F.getDocs(F.collection(db,...base,'rounds')),ids=[];snap.forEach(d=>ids.push(d.id));
    for(let i=0;i<ids.length;i+=400){const b=F.writeBatch(db);ids.slice(i,i+400).forEach(k=>b.delete(F.doc(db,...base,'rounds',k)));await b.commit()}
    await F.deleteDoc(F.doc(db,...base,'meta','settings'));
    S.pend=[];S.pdel=[];S.cloudUid='';S.lastPull=0;S.sSig='';persist();
    try{await fb.Au.deleteUser(user);toast('Cloud data and account deleted')}
    catch(e){await fb.Au.signOut(fb.auth);toast('Cloud data deleted. To remove the account itself, sign in again and delete once more.')}
  }catch(e){toast('Delete failed, try again')}
}

function accountCard(){
  const h=b=>`<div class="card"><h2>Account</h2>${b}</div>`;
  if(!FIREBASE_CONFIG)return h('<p class="mute">Cloud sync is not set up in this version.</p>');
  if(!fb)return h(`<p class="mute">${esc(cloudMsg||'Loading cloud...')}</p>`);
  if(!user)return h(`<p class="mute">Sign in to save your putts in the cloud so you never lose them. The app owner can technically see stored stats and your email, but does not look at them. You can delete everything at any time.</p><button class="btn" data-a="c-google">Continue with Google</button><input class="inp" id="em" type="email" placeholder="Email" autocomplete="email" style="margin-top:12px"><input class="inp" id="pw" type="password" placeholder="Password (min 6 characters)" autocomplete="current-password"><button class="btn alt" data-a="c-in">Sign in</button><button class="btn alt" data-a="c-new">Create account</button><button class="btn alt" data-a="c-reset">Forgot password</button>`);
  const w=S.pend.length+S.pdel.length;
  return h(`<p>Signed in as <b>${esc(user.email||'anonymous')}</b></p><p class="mute">${esc(cloudMsg)}${w?' · '+w+' changes waiting to upload':''}</p><button class="btn" data-a="c-sync">Sync now</button><button class="btn alt" data-a="c-out">Sign out</button><button class="btn" style="background:#d9534f;color:#fff" data-a="c-del">Delete my cloud data and account</button>`);
}

function copyVipps(){
  const ok=()=>toast('Code copied. Open Vipps and paste it. Thank you!');
  const fb=()=>{const t=document.createElement('textarea');t.value=VIPPS_NUMBER;document.body.appendChild(t);t.select();try{document.execCommand('copy');ok()}catch(e){toast('Could not copy')}t.remove()};
  if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(VIPPS_NUMBER).then(ok,fb);else fb();
}

function exportData(){
  const b=new Blob([JSON.stringify({app:'puttlog',v:2,exported:Date.now(),settings:{discs:S.discs,dist:S.dist,win:S.win,goal:S.goal},rounds:S.rounds},null,1)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='puttlog-'+day(Date.now())+'.json';a.click();
  S.lastExport=Date.now();save();render();
}

function cleanSettings(x){
  if(!x||typeof x!=='object')return null;
  const o={},Z=['C1X','C2','Outside C2'],c=(v,lo,hi)=>Math.min(hi,Math.max(lo,Math.round(+v)));
  if(x.discs>0)o.discs=c(x.discs,1,9);
  if(x.dist>0)o.dist=c(x.dist,4,40);
  if(x.win&&typeof x.win==='object'){o.win={};for(const z of Z)if(Array.isArray(x.win[z])&&x.win[z].length===2)o.win[z]=x.win[z].map(v=>c(v||20,5,500))}
  const g=x.goal;
  if(g&&(g.kind==='z'||g.kind==='m'))o.goal={kind:g.kind,z:Z.includes(g.z)?g.z:'C1X',m:c(g.m||6,4,40),pct:c(g.pct||60,5,100)};
  return Object.keys(o).length?o:null;
}

function importData(f){
  const r=new FileReader();
  r.onload=()=>{try{const j=JSON.parse(r.result);if(!Array.isArray(j.rounds))throw 0;
    const ok=j.rounds.filter(x=>x&&x.t&&x.d>=4&&x.n>0&&x.h>=0&&x.h<=x.n);
    const have=new Set(S.rounds.map(r=>r.t+'-'+r.d)),add=ok.filter(x=>!have.has(x.t+'-'+x.d));
    const st=cleanSettings(j.settings);
    if(!add.length&&!st){toast('Nothing new in that file');return}
    const parts=[];if(add.length)parts.push('add '+add.length+' rounds');if(st)parts.push('restore goal and settings');
    const msg=parts.join(' and ');if(!confirm(msg[0].toUpperCase()+msg.slice(1)+' from the file?'))return;
    if(add.length){S.rounds=S.rounds.concat(add).sort((a,b)=>a.t-b.t);add.forEach(qAdd)}
    if(st){if(st.discs)S.discs=st.discs;if(st.dist)S.dist=st.dist;if(st.win)Object.assign(S.win,st.win);if(st.goal)S.goal=st.goal}
    save();render();toast(add.length?'Added '+add.length+' rounds':'Settings restored')}catch(e){toast('Not a valid backup file')}};
  r.readAsText(f);
}

document.addEventListener('click',e=>{
  const b=e.target.closest('[data-a]');if(!b)return;const a=b.dataset.a,v=b.dataset.v;
  if(a==='tab')tab=v;
  else if(a==='trend')trend=v;
  else if(a==='dist')S.dist=Math.min(40,Math.max(4,S.dist+ +v));
  else if(a==='pad')padOpen=true;
  else if(a==='padx'){if(e.target!==b)return;padOpen=false}
  else if(a==='discs'){S.discs=+v;padOpen=false}
  else if(a==='hit'){const nr={t:Date.now(),d:S.dist,n:S.discs,h:+v};S.rounds.push(nr);qAdd(nr);toast(v+' of '+S.discs+' from '+S.dist+' m',1)}
  else if(a==='undo'){const ur=S.rounds.pop();if(ur)qDel(ur);$('#toast').style.display='none'}
  else if(a==='del'){const dr=S.rounds.find(r=>r.t===+v);if(dr)qDel(dr);S.rounds=S.rounds.filter(r=>r.t!==+v)}
  else if(a==='goal'){gd=S.goal?Object.assign({},S.goal):{kind:'z',z:'C1X',m:Math.max(4,S.dist),pct:60};gOpen=true}
  else if(a==='gk')gd.kind=v;
  else if(a==='gz')gd.z=v;
  else if(a==='gmd')gd.m=Math.min(40,Math.max(4,gd.m+ +v));
  else if(a==='gp')gd.pct=Math.min(100,Math.max(5,gd.pct+ +v));
  else if(a==='gsave'){S.goal=Object.assign({},gd);gOpen=false}
  else if(a==='gclear'){S.goal=null;gOpen=false}
  else if(a==='gcancel')gOpen=false;
  else if(a==='gx'){if(e.target!==b)return;gOpen=false}
  else if(a==='c-google')return cloudAuth('google');
  else if(a==='c-in')return cloudAuth('in');
  else if(a==='c-new')return cloudAuth('new');
  else if(a==='c-reset')return cloudAuth('reset');
  else if(a==='c-out')return cloudAuth('out');
  else if(a==='c-sync')return sync(true);
  else if(a==='c-del')return cloudDelete();
  else if(a==='vipps')return copyVipps();
  else if(a==='wipe'){if(!confirm('Delete all '+S.rounds.length+' rounds? This cannot be undone.'))return;S.rounds.forEach(qDel);S.rounds=[];S.lastExport=0;toast('All data deleted')}
  else if(a==='export')return exportData();
  save();render();
});
document.addEventListener('change',e=>{if(e.target.classList&&e.target.classList.contains('win')){const z=e.target.dataset.z,i=+e.target.dataset.i;let v=Math.round(+e.target.value);v=Math.min(500,Math.max(5,isNaN(v)?20:v));S.win[z][i]=v;e.target.value=v;save();toast('Saved');return}if(e.target.id==='mtr'){tm=+e.target.value;render()}if(e.target.id==='imp'&&e.target.files[0])importData(e.target.files[0])});
render();
initCloud();
addEventListener('online',()=>sync(true));
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&user&&Date.now()-lastSyncAt>3e5)sync(true)});
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script>
</body>
</html>
